<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistema</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container" style="width: 350px; height: auto; padding: 30px; display: flex; flex-direction: column; align-items: center;">
    
    <div class="header" style="margin-bottom: 20px; width: 100%; justify-content: center;">
      <span>Acesso ao Sistema</span>
    </div>

    <div class="modal" style="width: 100%; padding: 0;">
      <form id="loginForm" style="width: 100%;">
        <label for="iUsuario">Usuário</label>
        <input id="iUsuario" type="text" required style="border: 1px solid #ccc; border-radius: 5px;" />

        <label for="iSenha">Senha</label>
        <input id="iSenha" type="password" required style="border: 1px solid #ccc; border-radius: 5px;" />

        <button type="submit" id="btnLogin">Entrar</button>
      </form>
    </div>

    <div style="margin-top: 15px; font-size: 14px; text-align: center;">
        <a href="cadastro.html" style="color: rgb(57, 57, 226); text-decoration: none;">Não tem conta? Cadastre-se</a>
    </div>

  </div>
  <script src="login.js"></script>
</body>
</html>
